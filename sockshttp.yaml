# ============================================================
# SocksHTTP-Go — konfigurasi
# ============================================================

server: host
server_port: 443
username: username
password: password

tunnel_type: proxy
proxy_host: proxy_ip
proxy_port: 80
use_default_payload: false
custom_payload: "GET / HTTP/1.1[crlf]Host: edu.ruangguru.com[crlf]Connection: Keep-Alive[crlf][crlf]PATCH / HTTP/1.1[crlf]Host: [host][crlf]Upgrade: websocket[crlf][crlf][split]HTTP/ 69[crlf][crlf]"

pinger: 2
no_delay: true

startup_timeout: 60s
conn_retention: 60s

socks5:
  bind: 0.0.0.0
  port: 7776

# --- Fake-IP DNS ---
dns:
  enabled: true
  bind: 0.0.0.0:1054
  upstream: 1.1.1.1:53

redirect:
  bind: 0.0.0.0:7893

api:
  bind: 0.0.0.0:9091
  secret: ""

proxy-groups:
  - name: DEFAULT
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: xgody
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: nadvvo
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: nadifx
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: aku
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: mamivvo
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: zaki
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: REJECT

rules:
  - SRC-IP-CIDR,192.168.1.6/32,xgody
  - SRC-IP-CIDR,192.168.1.4/32,nadifx
  - SRC-IP-CIDR,192.168.1.3/32,aku
  - SRC-IP-CIDR,192.168.1.5/32,nadvvo
  - SRC-IP-CIDR,192.168.1.8/32,mamivvo
  - SRC-IP-CIDR,192.168.1.10/32,zaki
  - MATCH,DEFAULT

reconnect:
  enabled: true
  initial_delay: 500000000
  max_delay: 3000000000

health_check:
  enabled: true
  interval: 10000000000
  timeout: 10000000000
  target: 1.1.1.1:53
  failure_threshold: 2

log:
  level: debug
  file: /tmp/sockshttp.log
  max_size_mb: 10
  max_backups: 3

state_file: /tmp/sockshttp-state.json

# Fake-IP persist — file gzip JSON, ~30-45KB untuk 10k domain.
# Kosongkan (""), atau hapus baris ini untuk disable persist.
fakeip_file: /root/sockshttp-linux-arm64/sockshttp-fakeip.json.gz

pid_file: /tmp/sockshttp.pid