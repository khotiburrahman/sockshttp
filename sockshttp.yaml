# ============================================================
# SocksHTTP-Go — konfigurasi
# Mode: forward-only (DNS via tunnel, tanpa Fake-IP)
# ============================================================

server: host
server_port: 443
username: unme
password: pw

tunnel_type: proxy
proxy_host: proxy
proxy_port: port # Port fallback jika fitur proxy_rotate disable
use_default_payload: false
custom_payload: "GET / HTTP/1.1[crlf]Host: edu.ruangguru.com[crlf]Connection: Keep-Alive[crlf][crlf]PATCH / HTTP/1.1[crlf]Host: [host][crlf]Upgrade: websocket[crlf][crlf][split]HTTP/ 69[crlf][crlf]"

# File dinamis (Hot-reload)
dynamic_rules_file: "/root/sockshttp-linux-arm64/dynamic_rules.yaml"

pinger: 30
pinger_max: 45
no_delay: true

startup_timeout: 60s
conn_retention: 120s

socks5:
  bind: 0.0.0.0
  port: 7776

dns:
  enabled: true
  mode: forward
  bind: 0.0.0.0:1054
  upstream: 174.138.21.128:53

redirect:
  bind: 0.0.0.0:7893

api:
  bind: 0.0.0.0:9091
  secret: ""    # kosong = UI bebas diakses. Isi dengan string untuk aktifkan modal login.

proxy-groups:
  - name: DEFAULT
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: xgody
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: nadvvo
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: nadifx
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: aku
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: mamivvo
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: zaki
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL

rules:
  - SRC-IP-CIDR,192.168.1.6/32,xgody
  - SRC-IP-CIDR,192.168.1.4/32,nadifx
  - SRC-IP-CIDR,192.168.1.3/32,aku
  - SRC-IP-CIDR,192.168.1.5/32,nadvvo
  - SRC-IP-CIDR,192.168.1.8/32,mamivvo
  - SRC-IP-CIDR,192.168.1.10/32,zaki
  - MATCH,DEFAULT

reconnect:
  enabled: true
  initial_delay: 10s
  max_delay: 60s

health_check:
  enabled: true
  interval: 30s
  timeout: 10s
  target: 8.8.8.8:443
  failure_threshold: 3

failure_hook:
  enabled: true
  script: "/root/E5573/login.sh"
  script_args: ["ganti-ip"]
  shell: "/bin/sh"
  probe: ping
  target: "8.8.8.8"
  ping_count: 3
  interval: 10s
  probe_timeout: 5s
  script_timeout: 60s
  cooldown: 10m
  once_per_outage: true

log:
  level: debug
  file: /tmp/sockshttp.log
  max_size_mb: 10
  max_backups: 3

state_file: /tmp/sockshttp-state.json

limiter:
  enabled: true
  file: /root/sockshttp-linux-arm64/sockshttp-limiter.json

pid_file: /tmp/sockshttp.pid