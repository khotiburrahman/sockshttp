# ============================================================
# SocksHTTP-Go — konfigurasi
# ============================================================

# --- Server SSH tujuan ---
server: host
server_port: 443
username: hehe
password: hehehe

# --- Mode tunnel ---
tunnel_type: proxy
proxy_host: proxy
proxy_port: 8080
use_default_payload: false
custom_payload: "GET / HTTP/1.1[crlf]Host: edu.ruangguru.com[crlf]Connection: Keep-Alive[crlf][crlf]PATCH / HTTP/1.1[crlf]Host: [host][crlf]Upgrade: websocket[crlf][crlf][split]HTTP/ 69[crlf][crlf]"

# --- Koneksi ---
pinger: 3
no_delay: true

# --- Startup & retensi koneksi ---
startup_timeout: 60s        # timeout tunggu koneksi SSH pertama
conn_retention: 60s         # berapa lama koneksi closed disimpan di UI

# --- Listener SOCKS5 ---
socks5:
  bind: 0.0.0.0
  port: 7776

# --- Fake-IP DNS ---
dns:
  enabled: false
  bind: 0.0.0.0:1054
  upstream: 1.1.1.1:53

# --- Listener REDIRECT (iptables REDIRECT ke sini) ---
redirect:
  bind: 0.0.0.0:7893

# --- API/Web UI ---
api:
  bind: 0.0.0.0:9091
  secret: ""

# ============================================================
# PROXY GROUPS
# ============================================================
proxy-groups:
  - name: DEFAULT
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL

  - name: xgody
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL

  - name: nadvvo
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL

  - name: nadifx
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL

  - name: aku
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL

  - name: mamivvo
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL

  - name: zaki
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: REJECT

# ============================================================
# RULES — urutan penting, MATCH harus paling akhir
# ============================================================
rules:
  # Bypass Direct untuk XL (jika diperlukan)
  # - DOMAIN,www.xl.co.id,DIRECT

  # 1. Rute berdasarkan IP Lokal (Device Mapping)
  - SRC-IP-CIDR,192.168.1.6/32,xgody
  - SRC-IP-CIDR,192.168.1.4/32,nadifx
  - SRC-IP-CIDR,192.168.1.3/32,aku
  - SRC-IP-CIDR,192.168.1.5/32,nadvvo
  - SRC-IP-CIDR,192.168.1.8/32,mamivvo
  - SRC-IP-CIDR,192.168.1.10/32,zaki

  # 2. Sisa traffic diarahkan ke DEFAULT
  - MATCH,DEFAULT

# ============================================================
# PENGATURAN LAINNYA
# ============================================================
reconnect:
  enabled: true
  initial_delay: 500000000      # 500 ms (nanodetik)
  max_delay: 10000000000        # 10 s (nanodetik)

health_check:
  enabled: true
  interval: 30000000000         # 30 s (nanodetik)
  timeout: 10000000000          # 10 s (nanodetik)
  target: 1.1.1.1:53
  failure_threshold: 5

log:
  level: debug
  file: /tmp/sockshttp.log
  max_size_mb: 10
  max_backups: 3

state_file: /tmp/sockshttp-state.json
pid_file: /tmp/sockshttp.pid