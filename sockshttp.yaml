# ============================================================
# SocksHTTP-Go — konfigurasi
# Mode: forward-only (DNS via tunnel, tanpa Fake-IP)
# ============================================================

# ------------------------------------------------------------
# SSH — single account (legacy, tetap didukung):
# server: host
# server_port: 443
# username: unme
# password: pw
#
# SSH — multi-account (baru):
# Isi ssh_accounts. Kalau ssh_accounts diisi, field top-level
# server/server_port/username/password diabaikan untuk dial.
# Kalau ssh_accounts KOSONG, otomatis dibentuk 1 akun dari
# field top-level (kompatibel dengan config lama + flag CLI).
# ------------------------------------------------------------

max_retry_per_account: 3    # rotate setelah 3x gagal per akun (auth fail = rotate langsung)

ssh_accounts:
  - name: "Utama"
    server: server1.example.com
    server_port: 443
    username: user1
    password: pass1
  - name: "Backup"
    server: server2.example.com
    server_port: 443
    username: user2
    password: pass2
  - name: "Cadangan"
    server: server3.example.com
    server_port: 22
    username: user3
    key_path: /root/.ssh/id_ed25519
  # - server: server3.example.com
  #   server_port: 22
  #   username: user3
  #   key_path: /root/.ssh/id_ed25519
  #   password: passphrase_key   # opsional, kalau key ber-passphrase

tunnel_type: proxy
proxy_host: proxy
proxy_port: 443
use_default_payload: false
custom_payload: "GET / HTTP/1.1[crlf]Host: edu.ruangguru.com[crlf]Connection: Keep-Alive[crlf][crlf]PATCH / HTTP/1.1[crlf]Host: [host][crlf]Upgrade: websocket[crlf][crlf][split]HTTP/ 69[crlf][crlf]"

# File dinamis (Hot-reload)
dynamic_rules_file: "/root/sockshttp-linux-arm64/dynamic_rules.yaml"

pinger: 30
pinger_max: 45
pinger_timeout: 20s
no_delay: true

startup_timeout: 60s
conn_retention: 120s

socks5:
  bind: 0.0.0.0
  port: 7776

dns:
  enabled: true
  mode: forward
  bind: 0.0.0.0:1054
  upstream: 174.138.21.128:53

adblock:
  enable: true
  path: /root/sockshttp-linux-arm64/geosite.dat

redirect:
  bind: 0.0.0.0:7893

api:
  bind: 0.0.0.0:9091
  secret: ""    # kosong = UI bebas diakses. Isi string untuk modal login.

proxy-groups:
  - name: DEFAULT
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: xgody
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: nadvvo
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: nadifx
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: aku
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: mamivvo
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL
  - name: zaki
    type: select
    proxies: [TUNNEL, DIRECT, REJECT]
    default: TUNNEL

rules:
  - SRC-IP-CIDR,192.168.1.6/32,xgody
  - SRC-IP-CIDR,192.168.1.4/32,nadifx
  - SRC-IP-CIDR,192.168.1.3/32,aku
  - SRC-IP-CIDR,192.168.1.5/32,nadvvo
  - SRC-IP-CIDR,192.168.1.8/32,mamivvo
  - SRC-IP-CIDR,192.168.1.10/32,zaki
  - MATCH,DEFAULT

reconnect:
  enabled: true
  initial_delay: 10s
  max_delay: 60s

health_check:
  enabled: true
  interval: 30s
  timeout: 10s
  target: 8.8.8.8:443
  failure_threshold: 3

failure_hook:
  enabled: true
  script: "/root/E5573/login.sh"
  script_args: ["ganti-ip"]
  shell: "/bin/sh"
  check_interval: 5s
  max_reconnects: 3
  reconnect_window: 1m
  max_downtime: 2m
  script_timeout: 120s
  cooldown: 10m
  once_per_outage: true

log:
  level: debug
  file: /tmp/sockshttp.log
  max_size_mb: 10
  max_backups: 3

state_file: /tmp/sockshttp-state.json

limiter:
  enabled: true
  file: /root/sockshttp-linux-arm64/sockshttp-limiter.json

pid_file: /tmp/sockshttp.pid