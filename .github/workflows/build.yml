name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/sha), kosong = current"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            name: sockshttp-linux-arm64
          - goarch: amd64
            name: sockshttp-linux-amd64

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: go mod tidy
        run: go mod tidy

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -trimpath \
            -ldflags="-s -w -X main.Version=$VERSION" \
            -o dist/${{ matrix.name }} .

      - name: verify binary
        run: |
          file dist/${{ matrix.name }}
          ls -lh dist/${{ matrix.name }}

      - name: package
        run: |
          cd dist
          cp ../sockshttp.yaml .
          tar czf ${{ matrix.name }}.tar.gz \
            ${{ matrix.name }} sockshttp.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.tar.gz