name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/sha), kosong = current"
        required: false
        default: ""
  push:
    branches: [main, master]
    paths:
      - "*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            name: sockshttp-linux-arm64
          - goarch: amd64
            name: sockshttp-linux-amd64

    # Pastikan GOPROXY konsisten — jangan pakai `direct` saja.
    # Kalau runner Anda di region yang memblokir proxy.golang.org,
    # ganti dengan mirror (lihat catatan di bawah).
    env:
      GOPROXY: "https://proxy.golang.org,direct"
      GOSUMDB: "sum.golang.org"
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
          # cache-dependency-path default: go.sum — OK kalau go.sum di-commit
          cache-dependency-path: go.sum

      # Baca-only — TIDAK boleh ubah go.mod/go.sum di CI
      - name: go mod download
        run: go mod download

      - name: go mod verify
        run: go mod verify

      # Deteksi kalau go.mod/go.sum tidak sinkron (dirty) — fail fast,
      # jangan diam-diam menulis ulang file.
      - name: cek go.mod/go.sum tidak dirty
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod / go.sum tidak sinkron. Jalankan 'go mod tidy' di lokal, commit, lalu push."
            git diff go.mod go.sum
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -trimpath \
            -ldflags="-s -w -X main.Version=$VERSION" \
            -o dist/${{ matrix.name }} .

      - name: verify binary
        run: |
          file dist/${{ matrix.name }}
          ls -lh dist/${{ matrix.name }}

      - name: package
        run: |
          cd dist
          cp ../sockshttp.yaml .
          cp ../dynamic_rules.yaml . || true
          tar czf ${{ matrix.name }}.tar.gz \
            ${{ matrix.name }} sockshttp.yaml dynamic_rules.yaml 2>/dev/null || \
          tar czf ${{ matrix.name }}.tar.gz ${{ matrix.name }} sockshttp.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.tar.gz
          retention-days: 7